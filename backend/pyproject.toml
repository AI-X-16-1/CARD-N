[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "asyncmy>=0.2.14",
    "cryptography>=44.0.0",
    "faster-whisper>=1.1.0",
    "fastapi>=0.141.1",
    "google-genai>=1.0.0",
    "httpx>=0.28.1",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0",
    "paddleocr>=3.0.0",
    # Capped below 3.3: that release dropped the Linux aarch64 wheels, and the
    # deployment target (Oracle Cloud's Always Free tier) is ARM. 3.2.2 publishes
    # x86_64, aarch64 and win_amd64 for cp311, so one version covers the ARM server,
    # the x86 container and everyone's Windows dev machine.
    "paddlepaddle>=3.0.0,<3.3",
    "pillow>=10.0.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# FastAPI's DI pattern requires calling Depends()/Query() in argument defaults.
ignore = ["B008"]
